<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Vaani</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='30%25' cy='30%25'%3E%3Cstop offset='0%25' stop-color='%23d7d0ff'/%3E%3Cstop offset='100%25' stop-color='%236b58c8'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' font-family='sans-serif' font-weight='bold' fill='%230b0819'%3EV%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/lib/fonts.css" />
<style>
  :root{
    --ink:#000; --paper:#fff; --panel:#0d0d10; --panel2:#131318;
    --line:rgba(255,255,255,.13); --mute:rgba(255,255,255,.54);
    --violet:#b9a8ff; --green:#7ee2a8; --amber:#f5c26b; --red:#f88c8c;
    --sans:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif:"Instrument Serif", Georgia, serif;
    --pad: clamp(18px, 3.4vw, 44px);
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--ink); color:var(--paper); font-family:var(--sans); font-size:15px; -webkit-font-smoothing:antialiased}
  a{color:inherit; text-decoration:none}
  h1,h2,h3{margin:0; font-weight:400; letter-spacing:-.02em}
  em{font-family:var(--serif); font-style:italic}
  .mute{color:var(--mute)}

  header{display:flex; align-items:center; justify-content:space-between; padding:16px var(--pad); border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(0,0,0,.82); backdrop-filter:blur(14px); z-index:20}
  .mark{font-size:14px; letter-spacing:.26em; text-transform:uppercase}
  .hnav{display:flex; align-items:center; gap:22px; font-size:13.5px}
  .hnav a{color:var(--mute)} .hnav a:hover{color:var(--paper)}
  @media(max-width:640px){ .hnav .opt{display:none} }
  .btn{display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-family:inherit; font-size:13.5px; padding:9px 18px; border-radius:999px; border:1px solid var(--line); background:transparent; color:inherit; transition:.2s}
  .btn:hover{border-color:rgba(255,255,255,.45)}
  .btn:disabled{opacity:.5; cursor:default}
  .btn-fill{background:var(--paper); color:var(--ink); border-color:var(--paper)}
  .btn-sm{padding:6px 13px; font-size:12.5px}
  .btn-danger{color:var(--red)}

  main{padding:clamp(26px,4vw,50px) var(--pad) 80px; max-width:1320px; margin:0 auto}
  .title{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:24px}
  .title h1{font-size:clamp(30px,4vw,52px); line-height:1}
  select, input, textarea{background:var(--panel); border:1px solid var(--line); color:var(--paper); font-family:inherit; font-size:14px; padding:9px 12px; border-radius:10px; outline:none; width:100%}
  select:focus, input:focus, textarea:focus{border-color:rgba(185,168,255,.6)}
  textarea{resize:vertical; min-height:70px; line-height:1.45}
  input[type=checkbox]{width:auto; accent-color:var(--violet)}
  #range{width:auto}

  .tabs{display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:30px; overflow-x:auto}
  .tab{padding:11px 16px; font-size:14px; color:var(--mute); border-bottom:2px solid transparent; margin-bottom:-1px; cursor:pointer; white-space:nowrap; background:none; border-top:0; border-left:0; border-right:0; font-family:inherit}
  .tab.on{color:var(--paper); border-bottom-color:var(--violet)}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:26px}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px}
  .kpi .k{font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--mute); margin-bottom:14px}
  .kpi .v{font-size:clamp(28px,3.2vw,40px); font-family:var(--serif); line-height:1; letter-spacing:-.02em}
  .kpi .s{font-size:12.5px; color:var(--mute); margin-top:8px}

  .cols{display:grid; grid-template-columns:1.55fr 1fr; gap:14px; align-items:start}
  @media(max-width:1000px){ .cols{grid-template-columns:1fr} }
  /* Grid items default to min-width:auto, so wide form rows stretch the
     column past the viewport on phones instead of shrinking. */
  .cols > *, .grid2 > *, .hours-row > *, .addrow > *{min-width:0}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:14px}
  .card h3{font-size:15px; margin-bottom:4px}
  .card .sub{font-size:12.5px; color:var(--mute); margin-bottom:20px; line-height:1.5}

  .chart{display:flex; align-items:flex-end; gap:4px; height:150px; padding-top:8px}
  .bar{flex:1; background:linear-gradient(180deg,var(--violet),rgba(185,168,255,.22)); border-radius:3px 3px 0 0; min-height:2px; position:relative; transition:height .5s cubic-bezier(.2,.7,.3,1)}
  .bar:hover::after{content:attr(data-label); position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line); padding:5px 9px; border-radius:7px; font-size:11px; white-space:nowrap; margin-bottom:7px; z-index:5}
  .xaxis{display:flex; justify-content:space-between; font-size:10.5px; color:var(--mute); margin-top:10px}

  .tablewrap{overflow-x:auto}
  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th{text-align:left; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--mute); font-weight:500; padding:0 10px 12px 0; border-bottom:1px solid var(--line)}
  td{padding:13px 10px 13px 0; border-bottom:1px solid rgba(255,255,255,.06); vertical-align:middle}
  tr.row{cursor:pointer; transition:.15s}
  tr.row:hover td{background:rgba(255,255,255,.03)}
  .pill{display:inline-block; font-size:11px; padding:3px 10px; border-radius:999px; border:1px solid currentColor; white-space:nowrap}
  .p-booked, .p-confirmed, .p-completed{color:var(--green)} .p-completed_faq, .p-scheduled{color:var(--violet)}
  .p-escalated, .p-transferred{color:var(--amber)}
  .p-failed, .p-cancelled, .p-no_show{color:var(--red)} .p-unknown{color:var(--mute)}

  .empty{text-align:center; padding:52px 20px; color:var(--mute); font-size:14px; line-height:1.6}
  .empty a{color:var(--violet)}
  .bd{display:flex; align-items:center; gap:10px; margin-bottom:11px; font-size:13px}
  .bd .n{flex:1; color:var(--mute)}
  .bd .track{width:96px; height:5px; background:rgba(255,255,255,.09); border-radius:3px; overflow:hidden}
  .bd .fill{height:100%; background:var(--violet); border-radius:3px}

  /* settings forms */
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  @media(max-width:700px){ .grid2{grid-template-columns:1fr} }
  label.f{display:block; font-size:12px; color:var(--mute); margin-bottom:14px}
  label.f > span{display:block; margin-bottom:6px; letter-spacing:.02em}
  label.f small{display:block; margin-top:5px; font-size:11.5px; color:rgba(255,255,255,.4); line-height:1.4}
  .check{display:flex; align-items:center; gap:10px; font-size:13.5px; margin-bottom:12px; color:var(--paper)}
  .actions{display:flex; justify-content:flex-end; gap:10px; margin-top:6px}
  .hours-row{display:grid; grid-template-columns:110px 70px 1fr 1fr; gap:10px; align-items:center; margin-bottom:9px; font-size:13.5px}
  @media(max-width:560px){ .hours-row{grid-template-columns:90px 50px 1fr 1fr} }
  .item{display:flex; gap:14px; align-items:flex-start; justify-content:space-between; padding:14px 0; border-bottom:1px solid rgba(255,255,255,.06)}
  .item:last-child{border-bottom:0}
  .item .main{flex:1; min-width:0}
  .item .main b{font-weight:500}
  .item .main p{margin:4px 0 0; font-size:13px; color:var(--mute); line-height:1.45; overflow-wrap:anywhere}
  .item .ops{display:flex; gap:6px; flex-shrink:0}
  .addrow{display:grid; gap:10px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line)}
  .addrow.svc{grid-template-columns:2fr 1fr 1fr auto}
  @media(max-width:700px){ .addrow.svc{grid-template-columns:1fr 1fr} }
  .checklist li{margin-bottom:7px; font-size:13.5px}
  .checklist .ok{color:var(--green)} .checklist .todo{color:var(--amber)}
  code{font-size:12.5px; background:rgba(255,255,255,.07); padding:2px 6px; border-radius:5px}

  /* transcript drawer */
  .drawer-bg{position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(6px); z-index:50; display:none}
  .drawer-bg.open{display:block}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:min(520px,100%); background:var(--panel2); border-left:1px solid var(--line); z-index:51; padding:26px; overflow-y:auto; transform:translateX(100%); transition:transform .32s cubic-bezier(.2,.7,.3,1)}
  .drawer.open{transform:none}
  .drawer .x{position:absolute; top:18px; right:20px; background:none; border:0; color:var(--mute); font-size:23px; cursor:pointer}
  .turn{margin:0 0 15px}
  .turn .who{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.36); margin-bottom:4px}
  .turn .txt{line-height:1.5; font-size:14px}
  .turn.agent .txt{color:var(--violet)}
  .turn.event{border-left:2px solid var(--green); padding-left:12px}
  .turn.event .who{color:var(--green)}
  .turn.event .txt{font-size:13px; color:rgba(255,255,255,.8)}

  .banner{background:rgba(185,168,255,.09); border:1px solid rgba(185,168,255,.3); border-radius:14px; padding:16px 20px; margin-bottom:24px; font-size:13.5px; color:var(--mute); line-height:1.55}
  .banner b{color:var(--paper); font-weight:500}
  .banner a{color:var(--violet)}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--panel2); border:1px solid var(--line); padding:11px 18px; border-radius:12px; font-size:13.5px; opacity:0; transition:.25s; z-index:60; pointer-events:none; max-width:calc(100% - 32px)}
  .toast.show{opacity:1; transform:translateX(-50%)}
  .toast.err{border-color:rgba(248,140,140,.5); color:var(--red)}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px}
  @media(max-width:700px){ .grid3{grid-template-columns:1fr} }
  .grid3 > *{min-width:0}
  .meter{height:5px; background:rgba(255,255,255,.09); border-radius:3px; overflow:hidden; margin-top:12px}
  .meter span{display:block; height:100%; background:var(--violet)}
  .meter span.warn{background:var(--amber)} .meter span.over{background:var(--red)}
  .card.cb{border-color:rgba(245,194,107,.35)}
  table.codes td{font-size:13px; padding:8px 10px 8px 0}
  table.codes code{white-space:nowrap}
  .preview .check{align-items:flex-start; line-height:1.45}
</style>
</head>
<body>

<header>
  <a href="/" class="mark">Vaani</a>
  <div class="hnav">
    <a href="/app" class="opt">Test your receptionist</a>
    <span id="who" class="mute opt"></span>
    <button class="btn" id="signout">Sign out</button>
  </div>
</header>

<main>
  <div class="title">
    <div>
      <h1 id="bizname">Your <em>front desk</em></h1>
      <p class="mute" style="margin:10px 0 0" id="subtitle">Calls, bookings and what Vaani knows about your business.</p>
    </div>
    <select id="range" aria-label="Date range">
      <option value="7">Last 7 days</option>
      <option value="14" selected>Last 14 days</option>
      <option value="30">Last 30 days</option>
    </select>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab" data-tab="calls" role="tab">Calls</button>
    <button class="tab" data-tab="appointments" role="tab">Appointments</button>
    <button class="tab" data-tab="settings" role="tab">Receptionist settings</button>
  </nav>

  <div id="content"><div class="empty">Loading…</div></div>
</main>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-label="Call transcript">
  <button class="x" id="drawerX" aria-label="Close">×</button>
  <div id="drawerBody"></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const API = (() => {
    const saved = localStorage.getItem('vaani_api');
    if (saved) return saved;
    if (location.port === '8080') return `${location.protocol}//${location.hostname}:8000`;
    return '';
  })();
  // Sessions are httpOnly cookies; drop tokens a pre-cookie version stored.
  localStorage.removeItem('vaani_token'); localStorage.removeItem('vaani_refresh');

  const content = document.getElementById('content');
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const mmss = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  const when = iso => {
    const d = new Date(iso), now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    return sameDay
      ? d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
      : d.toLocaleDateString([], {day:'numeric', month:'short'}) + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  };
  const label = o => ({booked:'Booked', completed_faq:'Answered', escalated:'Callback', transferred:'Transferred',
                       failed:'Failed', scheduled:'Scheduled', confirmed:'Confirmed', completed:'Completed',
                       cancelled:'Cancelled', no_show:'No-show'}[o] || o);
  const rupees = paise => (paise / 100).toLocaleString('en-IN');
  const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

  const toastEl = document.getElementById('toast');
  let toastTimer;
  function toast(msg, isErr) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.className = 'toast', 3600);
  }

  // One place for auth, JSON and error text, so every form reports the
  // server's actual reason. The session cookie rides along automatically;
  // X-Requested-With is the server's CSRF check for cookie-authenticated
  // writes. An expired access cookie is refreshed once, transparently.
  async function api(path, opts = {}, retried = false) {
    const r = await fetch(`${API}${path}`, {
      ...opts,
      credentials: 'same-origin',
      headers: { 'X-Requested-With': 'fetch', ...(opts.body ? {'Content-Type': 'application/json'} : {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    if (r.status === 401 && !retried) {
      const rr = await fetch(`${API}/api/auth/refresh`, { method: 'POST', credentials: 'same-origin',
                                                         headers: {'X-Requested-With': 'fetch'} });
      if (rr.ok) return api(path, opts, true);
      location.href = '/?signin=1';
      throw new Error('signed out');
    }
    if (r.status === 204) return null;
    const isJson = (r.headers.get('content-type') || '').includes('json');
    const data = isJson ? await r.json().catch(() => null) : null;
    if (!r.ok) throw new Error((data && data.detail) || `Request failed (${r.status})`);
    return data;
  }

  let me = null;
  document.getElementById('signout').onclick = async () => {
    try { await api('/api/auth/logout', {method: 'POST'}); } catch (e) {}
    location.href = '/';
  };

  // ---------------------------------------------------------------- tabs
  const range = document.getElementById('range');
  const tabs = [...document.querySelectorAll('.tab')];
  function show(tab) {
    if (!['calls','appointments','settings'].includes(tab)) tab = 'calls';
    tabs.forEach(t => t.classList.toggle('on', t.dataset.tab === tab));
    range.style.visibility = tab === 'calls' ? 'visible' : 'hidden';
    if (location.hash !== '#' + tab) history.replaceState(null, '', location.pathname + '#' + tab);
    ({calls: loadCalls, appointments: loadAppointments, settings: loadSettings})[tab]();
  }
  tabs.forEach(t => t.onclick = () => show(t.dataset.tab));
  range.onchange = () => loadCalls();

  function verifyBanner() {
    if (!me || me.is_verified) return '';
    return `<div class="banner"><b>Confirm your email.</b> We sent a link to ${esc(me.email)}. Booking and callback
      alerts go there, and it is needed before adding a phone number.
      <button class="btn btn-sm" id="resendVerify" style="margin-left:8px">Resend link</button></div>`;
  }
  function wireVerify() {
    const b = document.getElementById('resendVerify');
    if (b) b.onclick = async () => { try { await api('/api/auth/send-verification', {method: 'POST'}); toast('Verification email sent'); } catch (e) { toast(e.message, true); } };
  }

  // --------------------------------------------------------------- calls
  async function loadCalls() {
    content.innerHTML = '<div class="empty">Loading…</div>';
    let d, callbacks;
    try { [d, callbacks] = await Promise.all([api(`/api/dashboard/stats?days=${range.value}`), api('/api/dashboard/callbacks')]); }
    catch (e) { content.innerHTML = `<div class="empty">Could not load stats. ${esc(e.message)}</div>`; return; }

    const maxBar = Math.max(1, ...d.calls_by_day.map(x => x.calls));
    const totalOutcomes = d.outcome_breakdown.reduce((a, b) => a + b.count, 0) || 1;
    const u = d.usage;
    content.innerHTML = `
      ${verifyBanner()}
      ${d.total_calls === 0 ? `<div class="banner"><b>No calls yet.</b> Set up your hours, services and FAQs in
        <a href="#settings" data-go="settings">Receptionist settings</a>, then
        <a href="/app">talk to your receptionist</a> while signed in. Every conversation appears here with its transcript.</div>` : ''}

      <div class="kpis">
        <div class="kpi"><div class="k">Calls handled</div><div class="v">${d.window_calls}</div>
          <div class="s">${d.today_calls} today · ${d.after_hours_calls} after hours</div></div>
        <div class="kpi"><div class="k">Bookings</div><div class="v">${d.bookings}</div>
          <div class="s">${d.booked_value ? '₹' + rupees(d.booked_value) + ' booked by Vaani' : d.booking_rate + '% of calls'}</div></div>
        <div class="kpi"><div class="k">Resolved by AI</div><div class="v">${d.resolution_rate}%</div>
          <div class="s">${d.escalations} handed to your team</div></div>
        <div class="kpi"><div class="k">Minutes this month</div><div class="v">${u ? Math.round(u.minutes_used) : 0}</div>
          <div class="s">${u && u.minutes_allowed ? `of ${u.minutes_allowed} included` : 'avg call ' + mmss(d.avg_duration)}</div>
          ${u && u.minutes_allowed ? `<div class="meter"><span style="width:${Math.min(100, u.percent)}%" class="${u.percent >= 100 ? 'over' : u.percent >= 80 ? 'warn' : ''}"></span></div>` : ''}</div>
      </div>

      ${callbacks.length ? `<div class="card cb">
        <h3>Callbacks to return <span class="pill p-escalated" style="margin-left:6px">${callbacks.length}</span></h3>
        <div class="sub">Vaani promised these callers someone would ring them back.</div>
        ${callbacks.map(c => `<div class="item"><div class="main">
            <b>${c.customer_phone ? `<a href="tel:${esc(c.customer_phone)}" style="color:var(--violet)">${esc(c.customer_phone)}</a>` : 'Number withheld'}</b>
            <span class="mute" style="font-size:12.5px"> · ${when(c.started_at)}</span>
            <p>${esc(c.reason || c.preview || 'Asked for a person')}</p></div>
          <div class="ops"><button class="btn btn-sm" data-call="${esc(c.id)}">Transcript</button>
            <button class="btn btn-sm btn-fill" data-done="${esc(c.id)}">Mark done</button></div></div>`).join('')}
      </div>` : ''}

      <div class="cols">
        <div>
          <div class="card">
            <h3>Call volume</h3><div class="sub">Last ${d.window_days} days</div>
            <div class="chart">
              ${d.calls_by_day.map(x => `<div class="bar" style="height:${Math.max(2, x.calls / maxBar * 100)}%"
                   data-label="${x.date}: ${x.calls} call${x.calls === 1 ? '' : 's'}"></div>`).join('')}
            </div>
            <div class="xaxis"><span>${d.calls_by_day[0]?.date ?? ''}</span><span>${d.calls_by_day.at(-1)?.date ?? ''}</span></div>
          </div>

          <div class="card">
            <h3>Recent calls</h3><div class="sub">Click any row for the full transcript</div>
            ${d.recent_calls.length ? `<div class="tablewrap">
            <table>
              <thead><tr><th>When</th><th>Preview</th><th>Outcome</th><th>Length</th></tr></thead>
              <tbody>${d.recent_calls.map(c => `
                <tr class="row" data-id="${esc(c.id)}">
                  <td style="white-space:nowrap">${when(c.started_at)}</td>
                  <td class="mute">${esc(c.preview) || '—'}</td>
                  <td><span class="pill p-${esc(c.outcome)}">${label(c.outcome)}</span></td>
                  <td style="white-space:nowrap">${mmss(c.duration_seconds)}</td>
                </tr>`).join('')}</tbody>
            </table></div>` : '<div class="empty">No calls in this period.</div>'}
          </div>
        </div>

        <div>
          <div class="card">
            <h3>Outcomes</h3><div class="sub">How calls ended</div>
            ${d.outcome_breakdown.length ? d.outcome_breakdown.map(o => `
              <div class="bd">
                <span class="n">${label(o.outcome)}</span>
                <span class="track"><span class="fill" style="width:${o.count / totalOutcomes * 100}%"></span></span>
                <span style="width:24px; text-align:right">${o.count}</span>
              </div>`).join('') : '<div class="mute" style="font-size:13px">Nothing yet.</div>'}
          </div>

          <div class="card">
            <h3>Upcoming appointments</h3><div class="sub">Booked by Vaani</div>
            ${d.upcoming_appointments.length ? d.upcoming_appointments.map(a => `
              <div class="bd">
                <span class="n" style="color:var(--paper)">${esc(a.customer_name)}</span>
                <span class="mute">${when(a.start_time)}</span>
              </div>`).join('') : '<div class="mute" style="font-size:13px">None scheduled.</div>'}
          </div>
        </div>
      </div>`;

    wireVerify();
    content.querySelectorAll('tr.row').forEach(tr => tr.onclick = () => openCall(tr.dataset.id));
    content.querySelectorAll('[data-call]').forEach(b => b.onclick = () => openCall(b.dataset.call));
    content.querySelectorAll('[data-done]').forEach(b => b.onclick = async () => {
      b.disabled = true;
      try { await api(`/api/dashboard/calls/${b.dataset.done}/follow-up`, {method: 'POST', body: {done: true}}); toast('Marked as called back'); loadCalls(); }
      catch (e) { toast(e.message, true); b.disabled = false; }
    });
    content.querySelectorAll('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); show(a.dataset.go); });
  }

  // -------------------------------------------------------- appointments

    content.innerHTML = '<div class="empty">Loading…</div>';
    let rows;
    try { rows = await api('/api/appointments?days_back=7&days_ahead=90'); }
    catch (e) { content.innerHTML = `<div class="empty">Could not load appointments. ${esc(e.message)}</div>`; return; }

    content.innerHTML = `<div class="card">
      <h3>Appointments</h3><div class="sub">The past week and the next 90 days. Vaani checks this calendar before offering any slot.</div>
      ${rows.length ? `<div class="tablewrap"><table>
        <thead><tr><th>When</th><th>Customer</th><th>Service</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows.map(a => `<tr>
          <td style="white-space:nowrap">${when(a.start_time)}</td>
          <td>${esc(a.customer_name)}<div class="mute" style="font-size:12px">${esc(a.customer_phone)}</div></td>
          <td class="mute">${esc(a.service || '—')}${a.source ? ` · ${esc(a.source)}` : ''}</td>
          <td><span class="pill p-${esc(a.status)}">${label(a.status)}</span></td>
          <td style="text-align:right; white-space:nowrap">
            <select data-appt="${esc(a.id)}" aria-label="Change status" style="width:auto; padding:6px 10px; font-size:12.5px">
              ${['scheduled','confirmed','completed','no_show','cancelled'].map(s =>
                `<option value="${s}" ${s === a.status ? 'selected' : ''}>${label(s)}</option>`).join('')}
            </select>
          </td></tr>`).join('')}</tbody></table></div>`
        : '<div class="empty">No appointments yet. When Vaani books a caller in, it shows up here.</div>'}
    </div>`;

    content.querySelectorAll('select[data-appt]').forEach(sel => sel.onchange = async () => {
      try { await api(`/api/appointments/${sel.dataset.appt}`, {method: 'PATCH', body: {status: sel.value}}); toast('Appointment updated'); loadAppointments(); }
      catch (e) { toast(e.message, true); }
    });
  }

              <div class="item"><div class="main"><b>${esc(s.name)}</b>
                <p>${s.duration_minutes} min · ${s.price ? '₹' + rupees(s.price) : 'price on request'}${s.description ? ' · ' + esc(s.description) : ''}</p></div>

              <button class="btn btn-fill" type="submit">Add</button>
            </form>
          </div>

          <div class="card">
            <h3>Frequently asked questions</h3><div class="sub">Vaani answers from these. Keep answers short — they are spoken aloud.</div>
            <div>${b.faqs.length ? b.faqs.map(f => `
              <div class="item"><div class="main"><b>${esc(f.question)}</b><p>${esc(f.answer)}</p></div>
                <div class="ops"><button class="btn btn-sm btn-danger" data-del-faq="${esc(f.id)}">Delete</button></div></div>`).join('')
              : '<p class="mute" style="font-size:13.5px">No FAQs yet.</p>'}</div>
            <form id="faqForm" class="addrow">
              <input name="question" placeholder="Question, e.g. Do you have parking?" required maxlength="300">
              <textarea name="answer" placeholder="Answer" required maxlength="1000" style="min-height:56px"></textarea>
              <div class="actions" style="margin:0"><button class="btn btn-fill" type="submit">Add FAQ</button></div>

          </div>

            <h3>Setup checklist</h3><div class="sub">What your receptionist needs before real callers reach her.</div>
            <ul class="checklist" style="padding-left:0; list-style:none; margin:0">
              ${check(!!me?.is_verified, 'Email confirmed')}
              ${check(b.hours.some(h => h.is_open), 'Opening hours set')}
              ${check(b.services.length > 0, 'At least one service')}
              ${check(b.faqs.length > 0, 'A few FAQs')}
              ${check(!!p.transfer_phone, 'Transfer number for live handover')}
              ${check(live.length > 0, 'Phone number connected')}
            </ul>
          </div>

          <div class="card">
            <h3>Phone number</h3>
            ${live.length ? live.map(n => `<div class="item"><div class="main"><b>${esc(n.e164)}</b><p>Live — calls to this number reach Vaani.</p></div>
              ${nums.enabled ? `<div class="ops"><button class="btn btn-sm btn-danger" data-release="${esc(n.id)}">Release</button></div>` : ''}</div>`).join('')
              : `<div class="sub" style="margin:0 0 14px">No number connected yet. Until then, try your receptionist in the
                 <a href="/app" style="color:var(--violet)">browser demo</a> while signed in — it uses these settings.</div>`}
            ${nums.enabled && nums.used < (nums.limit || Infinity) ? `
              <form id="numSearch" class="addrow" style="grid-template-columns:1fr auto">
                <input name="contains" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="Digits to look for (optional)" aria-label="Digits">
                <button class="btn" type="submit">Find a number</button>
              </form><div id="numResults"></div>` : ''}
            ${!nums.enabled && !live.length ? '<p class="mute" style="font-size:13px; margin:0">Contact support to get your Vaani number.</p>' : ''}
            ${vaaniNumber ? `<div class="addrow">
              <button class="btn" id="testCall" type="button">Call me now to test</button>
              <small class="mute" style="font-size:12px">Vaani rings you from ${esc(vaaniNumber)} so you hear exactly what callers hear.</small>
            </div>` : ''}

          ${vaaniNumber ? `<div class="card">

              <tr><td>When you don't answer</td><td><code>**61*${esc(vaaniNumber)}#</code></td></tr>
              <tr><td>When you're busy</td><td><code>**67*${esc(vaaniNumber)}#</code></td></tr>
              <tr><td>When unreachable</td><td><code>**62*${esc(vaaniNumber)}#</code></td></tr>
              <tr><td>All three at once</td><td><code>**004*${esc(vaaniNumber)}#</code></td></tr>
              <tr><td>Turn forwarding off</td><td><code>##004#</code></td></tr>
            </tbody></table>
            <form id="fwdForm" class="addrow" style="grid-template-columns:1fr auto">
              <input name="forward_from" value="${esc(p.forward_from)}" placeholder="Your existing number" maxlength="32" aria-label="Your existing number">
              <button class="btn" type="submit">Save</button>
            </form>
            <small class="mute" style="font-size:12px; display:block; margin-top:8px">Dial the code from the phone that owns the number (Jio, Airtel and Vi all support these). Your carrier may charge for forwarded minutes.</small>
          </div>` : ''}

          <div class="card">
            <h3>Google Calendar</h3>
            <div class="sub" style="margin-bottom:14px">${p.google_calendar.connected

              : 'Connect it so Vaani never books over your own appointments, and bookings appear in your calendar.'}</div>
            <button class="btn ${p.google_calendar.connected ? '' : 'btn-fill'}" id="gcalBtn" type="button">${p.google_calendar.connected ? 'Disconnect' : 'Connect Google Calendar'}</button>

              <div class="item"><div class="main"><b>${esc(h.date)}</b>${h.reason ? `<p>${esc(h.reason)}</p>` : ''}</div>
                <div class="ops"><button class="btn btn-sm btn-danger" data-del-hol="${esc(h.id)}">Remove</button></div></div>`).join('')
              : '<p class="mute" style="font-size:13.5px">None.</p>'}</div>
            <form id="holForm" class="addrow" style="grid-template-columns:1fr 1fr auto">
              <input name="date" type="date" required aria-label="Date">
              <input name="reason" placeholder="Reason (optional)" maxlength="120">
              <button class="btn btn-fill" type="submit">Add</button>
            </form>
          </div>

          <div class="card">
            <h3>Account</h3><div class="sub">${esc(me?.email || '')}</div>
            <form id="pwForm">
              <label class="f"><span>Current password</span><input name="current" type="password" autocomplete="current-password" required></label>
              <label class="f"><span>New password</span><input name="next" type="password" autocomplete="new-password" minlength="8" required>
                <small>Changing it signs you out on every other device.</small></label>
              <div class="actions"><button class="btn" type="submit">Change password</button></div>
            </form>
            <div class="addrow">
              <button class="btn" id="exportBtn" type="button">Download all my data</button>
              <button class="btn btn-danger" id="deleteBtn" type="button">Delete account…</button>
            </div>
          </div>
        </div>
      </div>`;

    wireVerify();
    const saving = async (btn, fn, ok) => {
      btn.disabled = true;
      try { await fn(); toast(ok); loadSettings(); }
      catch (e) { toast(e.message, true); btn.disabled = false; }
    };
    const numOrNull = v => v === '' ? null : Number(v);

    const pf = document.getElementById('profileForm');
    pf.onsubmit = e => { e.preventDefault(); const f = pf.elements;
      saving(pf.querySelector('button'), () => api('/api/business', {method: 'PUT', body: {
        name: f.name.value, phone: f.phone.value, email: f.email.value, greeting: f.greeting.value, about: f.about.value,
        transfer_phone: f.transfer_phone.value, language: f.language.value, time_zone: f.time_zone.value,
        slot_minutes: Number(f.slot_minutes.value), capacity: Number(f.capacity.value),
        booking_enabled: f.booking_enabled.checked, sms_confirmations: f.sms_confirmations.checked,
        reminders_enabled: f.reminders_enabled.checked, message_channel: f.message_channel.value,
        retention_days: numOrNull(f.retention_days.value), monthly_minute_cap: numOrNull(f.monthly_minute_cap.value),

    const hf = document.getElementById('hoursForm');

    const sf = document.getElementById('svcForm');
    sf.onsubmit = e => { e.preventDefault(); const f = sf.elements;
      saving(sf.querySelector('button'), () => api('/api/business/services', {method: 'POST', body: {
        name: f.name.value, duration_minutes: Number(f.duration.value), price: Math.round(Number(f.price.value) * 100),
      }}), 'Service added'); };

    content.querySelectorAll('[data-edit-svc]').forEach(btn => btn.onclick = () => {
      const s = b.services.find(x => x.id === btn.dataset.editSvc);
      const name = prompt('Service name', s.name); if (name === null) return;
      const minutes = prompt('Duration (minutes)', s.duration_minutes); if (minutes === null) return;
      const price = prompt('Price (₹, 0 = on request)', s.price / 100); if (price === null) return;
      saving(btn, () => api(`/api/business/services/${s.id}`, {method: 'PUT', body: {
        name, description: s.description, duration_minutes: Number(minutes),
        price: Math.round(Number(price) * 100), buffer_minutes: s.buffer_minutes,
      }}), 'Service updated');
    });
    content.querySelectorAll('[data-del-svc]').forEach(btn => btn.onclick = () => confirm('Delete this service?') &&
      saving(btn, () => api(`/api/business/services/${btn.dataset.delSvc}`, {method: 'DELETE'}), 'Service deleted'));

    const ff = document.getElementById('faqForm');
    ff.onsubmit = e => { e.preventDefault(); const f = ff.elements;
      saving(ff.querySelector('button'), () => api('/api/business/faqs', {method: 'POST', body: {
        question: f.question.value, answer: f.answer.value }}), 'FAQ added'); };
    content.querySelectorAll('[data-del-faq]').forEach(btn => btn.onclick = () =>
      saving(btn, () => api(`/api/business/faqs/${btn.dataset.delFaq}`, {method: 'DELETE'}), 'FAQ deleted'));

    const hol = document.getElementById('holForm');
    hol.onsubmit = e => { e.preventDefault(); const f = hol.elements;
      saving(hol.querySelector('button'), () => api('/api/business/holidays', {method: 'POST', body: {
        date: f.date.value, reason: f.reason.value || null }}), 'Closed date added'); };
    content.querySelectorAll('[data-del-hol]').forEach(btn => btn.onclick = () =>
      saving(btn, () => api(`/api/business/holidays/${btn.dataset.delHol}`, {method: 'DELETE'}), 'Closed date removed'));

    // --- website import: preview, then apply what the owner ticks
    const imp = document.getElementById('importForm');
    imp.onsubmit = async e => { e.preventDefault();
      const btn = imp.querySelector('button'), box = document.getElementById('importPreview');
      btn.disabled = true; btn.textContent = 'Reading…';
      try {
        const d = await api('/api/business/import', {method: 'POST', body: {url: imp.elements.url.value}});
        box.innerHTML = `<div class="preview">
          <p class="mute" style="font-size:12.5px; margin:14px 0 10px">Found on ${esc(d.source)}. Untick anything that is wrong, then apply.</p>
          ${d.about ? `<label class="check"><input type="checkbox" data-imp="about" checked> About: <span class="mute">${esc(d.about)}</span></label>` : ''}
          ${d.hours.length ? `<label class="check"><input type="checkbox" data-imp="hours" checked> Hours for ${d.hours.length} day${d.hours.length === 1 ? '' : 's'}:
            <span class="mute">${d.hours.map(h => `${DAYS[h.day_of_week].slice(0,3)} ${h.is_open ? h.opens + '–' + h.closes : 'closed'}`).join(', ')}</span></label>` : ''}
          ${d.services.map((s, i) => `<label class="check"><input type="checkbox" data-imp="svc" data-i="${i}" checked> Service: ${esc(s.name)}
            <span class="mute">${s.duration_minutes ? s.duration_minutes + ' min' : ''}${s.price != null ? ' · ₹' + rupees(s.price) : ''}</span></label>`).join('')}
          ${d.faqs.map((f, i) => `<label class="check"><input type="checkbox" data-imp="faq" data-i="${i}" checked> FAQ: ${esc(f.question)}</label>`).join('')}
          ${!d.about && !d.hours.length && !d.services.length && !d.faqs.length ? '<p class="mute">Nothing useful found on that page. Try your About or Services page.</p>'
            : '<div class="actions"><button class="btn btn-fill" id="applyImport" type="button">Apply selected</button></div>'}
        </div>`;
        const apply = document.getElementById('applyImport');
        if (apply) apply.onclick = () => saving(apply, async () => {
          const on = sel => [...box.querySelectorAll(sel)].filter(x => x.checked);
          if (on('[data-imp="about"]').length) await api('/api/business', {method: 'PUT', body: {about: d.about}});
          if (on('[data-imp="hours"]').length) {
            const byDay = Object.fromEntries(d.hours.map(h => [h.day_of_week, h]));
            await api('/api/business/hours', {method: 'PUT', body: DAYS.map((_, i) => byDay[i]
              ? {day_of_week: i, is_open: byDay[i].is_open, opens: byDay[i].opens, closes: byDay[i].closes}
              : {day_of_week: i, is_open: hoursOf(i).is_open, opens: hoursOf(i).opens, closes: hoursOf(i).closes})});
          }
          for (const x of on('[data-imp="svc"]')) { const s = d.services[x.dataset.i];
            await api('/api/business/services', {method: 'POST', body: {name: s.name, description: s.description,
              duration_minutes: s.duration_minutes || 30, price: s.price || 0}}); }
          for (const x of on('[data-imp="faq"]')) await api('/api/business/faqs', {method: 'POST', body: d.faqs[x.dataset.i]});
        }, 'Imported — review your settings below');
      } catch (err) { box.innerHTML = ''; toast(err.message, true); }
      btn.disabled = false; btn.textContent = 'Read my website';
    };

    // --- numbers
    const ns = document.getElementById('numSearch');
    if (ns) ns.onsubmit = async e => { e.preventDefault();
      const out = document.getElementById('numResults'); out.innerHTML = '<p class="mute" style="font-size:13px">Searching…</p>';
      try {
        const found = await api(`/api/numbers/available?contains=${encodeURIComponent(ns.elements.contains.value)}`);
        out.innerHTML = found.length ? found.map(n => `<div class="item"><div class="main"><b>${esc(n.friendly)}</b><p>${esc(n.locality || '')}</p></div>
          <div class="ops"><button class="btn btn-sm btn-fill" data-buy="${esc(n.e164)}">Use this number</button></div></div>`).join('')
          : '<p class="mute" style="font-size:13px">No numbers matched. Try other digits.</p>';
        out.querySelectorAll('[data-buy]').forEach(btn => btn.onclick = () => confirm(`Connect ${btn.dataset.buy} to Vaani?`) &&
          saving(btn, () => api('/api/numbers', {method: 'POST', body: {phone_number: btn.dataset.buy}}), 'Number connected'));
      } catch (err) { out.innerHTML = ''; toast(err.message, true); }
    };
    content.querySelectorAll('[data-release]').forEach(btn => btn.onclick = () =>
      confirm('Release this number? Calls to it will stop reaching Vaani, and it may not be recoverable.') &&
      saving(btn, () => api(`/api/numbers/${btn.dataset.release}`, {method: 'DELETE'}), 'Number released'));

    const tc = document.getElementById('testCall');
    if (tc) tc.onclick = async () => {
      const phone = prompt('Which phone should Vaani call?', me?.phone || '+91 ');
      if (!phone) return;
      tc.disabled = true;
      try { const r = await api('/api/business/test-call', {method: 'POST', body: {phone}}); toast(`Calling ${r.calling}…`); }
      catch (err) { toast(err.message, true); }
      tc.disabled = false;
    };

    const fwd = document.getElementById('fwdForm');
    if (fwd) fwd.onsubmit = e => { e.preventDefault();
      saving(fwd.querySelector('button'), () => api('/api/business', {method: 'PUT', body: {forward_from: fwd.elements.forward_from.value}}), 'Saved'); };

    document.getElementById('gcalBtn').onclick = async () => {
      try {
        if (p.google_calendar.connected) { await api('/api/integrations/google/disconnect', {method: 'POST'}); toast('Calendar disconnected'); loadSettings(); }
        else { location.href = (await api('/api/integrations/google/connect')).url; }
      } catch (err) { toast(err.message, true); }
    };

    // --- account
    const pw = document.getElementById('pwForm');
    pw.onsubmit = e => { e.preventDefault();
      saving(pw.querySelector('button'), () => api('/api/auth/change-password', {method: 'POST', body: {
        current_password: pw.elements.current.value, new_password: pw.elements.next.value }}), 'Password changed'); };

    document.getElementById('exportBtn').onclick = async () => {
      try {
        const r = await fetch(`${API}/api/account/export`, {credentials: 'same-origin', headers: {'X-Requested-With': 'fetch'}});
        if (!r.ok) throw new Error(`Export failed (${r.status})`);
        const url = URL.createObjectURL(await r.blob());
        const a = Object.assign(document.createElement('a'), {href: url, download: 'vaani-export.json'});
        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      } catch (err) { toast(err.message, true); }
    };
    document.getElementById('deleteBtn').onclick = async () => {
      if (prompt('This permanently deletes your account, settings, calls and appointments, and releases your number. Type DELETE to confirm.') !== 'DELETE') return;
      const password = prompt('Enter your password to confirm');
      if (!password) return;
      try { await api('/api/account', {method: 'DELETE', body: {password, confirm: 'DELETE'}}); location.href = '/'; }
      catch (err) { toast(err.message, true); }
    };
  }

  // ---------------------------------------------------- transcript drawer
  const bg = document.getElementById('drawerBg');
  const drawer = document.getElementById('drawer');
  const body = document.getElementById('drawerBody');
  const close = () => { drawer.classList.remove('open'); bg.classList.remove('open'); };
  bg.onclick = close;
  document.getElementById('drawerX').onclick = close;
  addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  async function openCall(id) {
    body.innerHTML = '<div class="empty">Loading…</div>';
    bg.classList.add('open'); drawer.classList.add('open');
    try {
      const c = await api(`/api/dashboard/calls/${encodeURIComponent(id)}`);
      const spoken = c.transcript.filter(t => t.speaker !== 'event').length;
      body.innerHTML = `
        <h3 style="font-size:19px; margin-bottom:6px">Call transcript</h3>
        <p class="mute" style="font-size:12.5px; margin:0 0 8px">
          ${when(c.started_at)} · ${mmss(c.duration_seconds)} · ${spoken} turns${c.customer_phone ? ' · ' + esc(c.customer_phone) : ''}</p>
        <p style="margin:0 0 26px"><span class="pill p-${esc(c.outcome)}">${label(c.outcome)}</span></p>
        ${c.transcript.length ? c.transcript.map(t => {
          const kind = t.speaker === 'caller' ? 'caller' : t.speaker === 'event' ? 'event' : 'agent';
          const who = {caller: 'Caller', agent: 'Vaani', event: 'Action'}[kind];
          return `<div class="turn ${kind}"><div class="who">${who}</div><div class="txt">${esc(t.text)}</div></div>`;
        }).join('') : '<div class="empty">No transcript recorded (or erased under your retention setting).</div>'}`;
    } catch (e) {
      body.innerHTML = '<div class="empty">Could not load this transcript.</div>';
    }
  }

  // Messages from links in emails / OAuth redirects.
  const q = new URLSearchParams(location.search);
  const notices = {verified: {'1': ['Email confirmed. Thank you!'], '0': ['That confirmation link is invalid or expired.', true]},
                   gcal: {connected: ['Google Calendar connected'], denied: ['Google Calendar was not connected', true],
                          failed: ['Could not connect Google Calendar. Try again.', true], invalid: ['That calendar link expired. Try again.', true]}};
  for (const [k, map] of Object.entries(notices)) if (q.has(k) && map[q.get(k)]) setTimeout(() => toast(...map[q.get(k)]), 300);
  if (q.toString()) history.replaceState(null, '', location.pathname + location.hash);

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  api('/api/auth/me').then(u => {
    me = u;
    document.getElementById('who').textContent = u.email;
    show(location.hash.slice(1) || 'calls');
  }).catch(() => {});
})();
</script>
</body>
</html>
