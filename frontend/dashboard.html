<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Vaani</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='30%25' cy='30%25'%3E%3Cstop offset='0%25' stop-color='%23d7d0ff'/%3E%3Cstop offset='100%25' stop-color='%236b58c8'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' font-family='sans-serif' font-weight='bold' fill='%230b0819'%3EV%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/lib/fonts.css" />
<style>
  :root{
    --ink:#000; --paper:#fff; --panel:#0d0d10; --panel2:#131318;
    --line:rgba(255,255,255,.13); --mute:rgba(255,255,255,.54);
    --violet:#b9a8ff; --green:#7ee2a8; --amber:#f5c26b; --red:#f88c8c;
    --sans:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif:"Instrument Serif", Georgia, serif;
    --pad: clamp(18px, 3.4vw, 44px);
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--ink); color:var(--paper); font-family:var(--sans); font-size:15px; -webkit-font-smoothing:antialiased}
  a{color:inherit; text-decoration:none}
  h1,h2,h3{margin:0; font-weight:400; letter-spacing:-.02em}
  em{font-family:var(--serif); font-style:italic}
  .mute{color:var(--mute)}

  header{display:flex; align-items:center; justify-content:space-between; padding:16px var(--pad); border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(0,0,0,.82); backdrop-filter:blur(14px); z-index:20}
  .mark{font-size:14px; letter-spacing:.26em; text-transform:uppercase}
  .hnav{display:flex; align-items:center; gap:22px; font-size:13.5px}
  .hnav a{color:var(--mute)} .hnav a:hover{color:var(--paper)}
  .btn{display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-family:inherit; font-size:13.5px; padding:9px 18px; border-radius:999px; border:1px solid var(--line); background:transparent; color:inherit; transition:.2s}
  .btn:hover{border-color:rgba(255,255,255,.45)}
  .btn-fill{background:var(--paper); color:var(--ink); border-color:var(--paper)}

  main{padding:clamp(26px,4vw,50px) var(--pad) 80px; max-width:1320px; margin:0 auto}
  .title{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:34px}
  .title h1{font-size:clamp(30px,4vw,52px); line-height:1}
  select{background:var(--panel); border:1px solid var(--line); color:var(--paper); font-family:inherit; font-size:13.5px; padding:9px 14px; border-radius:10px; outline:none}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:26px}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px}
  .kpi .k{font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--mute); margin-bottom:14px}
  .kpi .v{font-size:clamp(28px,3.2vw,40px); font-family:var(--serif); line-height:1; letter-spacing:-.02em}
  .kpi .s{font-size:12.5px; color:var(--mute); margin-top:8px}

  .cols{display:grid; grid-template-columns:1.55fr 1fr; gap:14px; align-items:start}
  @media(max-width:1000px){ .cols{grid-template-columns:1fr} }
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:14px}
  .card h3{font-size:15px; margin-bottom:4px}
  .card .sub{font-size:12.5px; color:var(--mute); margin-bottom:20px}

  /* bar chart */
  .chart{display:flex; align-items:flex-end; gap:4px; height:150px; padding-top:8px}
  .bar{flex:1; background:linear-gradient(180deg,var(--violet),rgba(185,168,255,.22)); border-radius:3px 3px 0 0; min-height:2px; position:relative; transition:height .5s cubic-bezier(.2,.7,.3,1)}
  .bar:hover::after{content:attr(data-label); position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line); padding:5px 9px; border-radius:7px; font-size:11px; white-space:nowrap; margin-bottom:7px; z-index:5}
  .xaxis{display:flex; justify-content:space-between; font-size:10.5px; color:var(--mute); margin-top:10px}

  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th{text-align:left; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--mute); font-weight:500; padding:0 10px 12px 0; border-bottom:1px solid var(--line)}
  td{padding:13px 10px 13px 0; border-bottom:1px solid rgba(255,255,255,.06)}
  tr.row{cursor:pointer; transition:.15s}
  tr.row:hover td{background:rgba(255,255,255,.03)}
  .pill{display:inline-block; font-size:11px; padding:3px 10px; border-radius:999px; border:1px solid currentColor; white-space:nowrap}
  .p-booked{color:var(--green)} .p-completed_faq{color:var(--violet)}
  .p-escalated{color:var(--amber)} .p-transferred{color:var(--amber)}
  .p-failed{color:var(--red)} .p-unknown{color:var(--mute)}

  .empty{text-align:center; padding:52px 20px; color:var(--mute); font-size:14px; line-height:1.6}
  .empty a{color:var(--violet)}
  .bd{display:flex; align-items:center; gap:10px; margin-bottom:11px; font-size:13px}
  .bd .n{flex:1; color:var(--mute)}
  .bd .track{width:96px; height:5px; background:rgba(255,255,255,.09); border-radius:3px; overflow:hidden}
  .bd .fill{height:100%; background:var(--violet); border-radius:3px}

  /* transcript drawer */
  .drawer-bg{position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(6px); z-index:50; display:none}
  .drawer-bg.open{display:block}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:min(520px,100%); background:var(--panel2); border-left:1px solid var(--line); z-index:51; padding:26px; overflow-y:auto; transform:translateX(100%); transition:transform .32s cubic-bezier(.2,.7,.3,1)}
  .drawer.open{transform:none}
  .drawer .x{position:absolute; top:18px; right:20px; background:none; border:0; color:var(--mute); font-size:23px; cursor:pointer}
  .turn{margin:0 0 15px}
  .turn .who{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.36); margin-bottom:4px}
  .turn .txt{line-height:1.5; font-size:14px}
  .turn.agent .txt{color:var(--violet)}

  .banner{background:rgba(185,168,255,.09); border:1px solid rgba(185,168,255,.3); border-radius:14px; padding:16px 20px; margin-bottom:24px; font-size:13.5px; color:var(--mute); line-height:1.55}
  .banner b{color:var(--paper); font-weight:500}
</style>
</head>
<body>

<header>
  <a href="/" class="mark">Vaani</a>
  <div class="hnav">
    <a href="/app">Live demo</a>
    <a href="/docs">API</a>
    <span id="who" class="mute"></span>
    <button class="btn" id="signout">Sign out</button>
  </div>
</header>

<main>
  <div class="title">
    <div>
      <h1>Call <em>intelligence</em></h1>
      <p class="mute" style="margin:10px 0 0">Every call Vaani handled, with transcripts and outcomes.</p>
    </div>
    <select id="range">
      <option value="7">Last 7 days</option>
      <option value="14" selected>Last 14 days</option>
      <option value="30">Last 30 days</option>
    </select>
  </div>

  <div id="content"><div class="empty">Loading…</div></div>
</main>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer">
  <button class="x" id="drawerX" aria-label="Close">×</button>
  <div id="drawerBody"></div>
</aside>

<script>
(() => {
  const API = (() => {
    const saved = localStorage.getItem('vaani_api');
    if (saved) return saved;
    if (location.port === '8080') return `${location.protocol}//${location.hostname}:8000`;
    return '';
  })();

  const token = localStorage.getItem('vaani_token');
  if (!token) { location.href = '/?signin=1'; return; }

  const auth = { Authorization: `Bearer ${token}` };
  const content = document.getElementById('content');
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const mmss = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  const when = iso => {
    const d = new Date(iso), now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    return sameDay
      ? d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
      : d.toLocaleDateString([], {day:'numeric', month:'short'}) + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  };
  const label = o => ({booked:'Booked', completed_faq:'Answered', escalated:'Escalated', transferred:'Transferred', failed:'Failed'}[o] || o);

  document.getElementById('signout').onclick = () => {
    localStorage.removeItem('vaani_token');
    location.href = '/';
  };

  (async () => {
    try {
      const r = await fetch(`${API}/api/auth/me`, { headers: auth });
      if (r.ok) { const u = await r.json(); document.getElementById('who').textContent = u.email; }
    } catch (e) {}
  })();

  async function load(days) {
    content.innerHTML = '<div class="empty">Loading…</div>';
    let d;
    try {
      const r = await fetch(`${API}/api/dashboard/stats?days=${days}`, { headers: auth });
      if (r.status === 401) { localStorage.removeItem('vaani_token'); location.href = '/?signin=1'; return; }
      if (r.status === 409) {
        content.innerHTML = `<div class="empty">This account has no business linked yet.<br>
          Sign up again with a business name, or add one via the <a href="/docs">API</a>.</div>`;
        return;
      }
      if (!r.ok) throw new Error(r.status);
      d = await r.json();
    } catch (e) {
      content.innerHTML = `<div class="empty">Could not load stats. Is the backend running?</div>`;
      return;
    }
    render(d);
  }

  function render(d) {
    const maxBar = Math.max(1, ...d.calls_by_day.map(x => x.calls));
    const totalOutcomes = d.outcome_breakdown.reduce((a, b) => a + b.count, 0) || 1;

    const noData = d.total_calls === 0;

    content.innerHTML = `
      ${noData ? `<div class="banner"><b>No calls yet.</b> Every conversation in the
        <a href="/app" style="color:var(--violet)">live demo</a> is recorded here with its full
        transcript and outcome — try it and refresh this page.</div>` : ''}

      <div class="kpis">
        <div class="kpi"><div class="k">Calls handled</div><div class="v">${d.window_calls}</div>
          <div class="s">${d.today_calls} today · ${d.total_calls} all time</div></div>
        <div class="kpi"><div class="k">Bookings</div><div class="v">${d.bookings}</div>
          <div class="s">${d.booking_rate}% of calls</div></div>
        <div class="kpi"><div class="k">Resolved by AI</div><div class="v">${d.resolution_rate}%</div>
          <div class="s">${d.escalations} escalated to a human</div></div>
        <div class="kpi"><div class="k">Avg call length</div><div class="v">${mmss(d.avg_duration)}</div>
          <div class="s">${d.minutes_used} minutes used</div></div>
      </div>

      <div class="cols">
        <div>
          <div class="card">
            <h3>Call volume</h3><div class="sub">Last ${d.window_days} days</div>
            <div class="chart">
              ${d.calls_by_day.map(x => `<div class="bar" style="height:${Math.max(2, x.calls / maxBar * 100)}%"
                   data-label="${x.date}: ${x.calls} call${x.calls === 1 ? '' : 's'}"></div>`).join('')}
            </div>
            <div class="xaxis"><span>${d.calls_by_day[0]?.date ?? ''}</span><span>${d.calls_by_day.at(-1)?.date ?? ''}</span></div>
          </div>

          <div class="card">
            <h3>Recent calls</h3><div class="sub">Click any row for the full transcript</div>
            ${d.recent_calls.length ? `
            <table>
              <thead><tr><th>When</th><th>Preview</th><th>Outcome</th><th>Length</th></tr></thead>
              <tbody>${d.recent_calls.map(c => `
                <tr class="row" data-id="${c.id}">
                  <td style="white-space:nowrap">${when(c.started_at)}</td>
                  <td class="mute">${esc(c.preview) || '—'}</td>
                  <td><span class="pill p-${c.outcome}">${label(c.outcome)}</span></td>
                  <td style="white-space:nowrap">${mmss(c.duration_seconds)}</td>
                </tr>`).join('')}</tbody>
            </table>` : '<div class="empty">No calls in this period.</div>'}
          </div>
        </div>

        <div>
          <div class="card">
            <h3>Outcomes</h3><div class="sub">How calls ended</div>
            ${d.outcome_breakdown.length ? d.outcome_breakdown.map(o => `
              <div class="bd">
                <span class="n">${label(o.outcome)}</span>
                <span class="track"><span class="fill" style="width:${o.count / totalOutcomes * 100}%"></span></span>
                <span style="width:24px; text-align:right">${o.count}</span>
              </div>`).join('') : '<div class="mute" style="font-size:13px">Nothing yet.</div>'}
          </div>

          <div class="card">
            <h3>Upcoming appointments</h3><div class="sub">Booked by Vaani</div>
            ${d.upcoming_appointments.length ? d.upcoming_appointments.map(a => `
              <div class="bd">
                <span class="n" style="color:var(--paper)">${esc(a.customer_name)}</span>
                <span class="mute">${when(a.start_time)}</span>
              </div>`).join('') : '<div class="mute" style="font-size:13px">None scheduled.</div>'}
          </div>
        </div>
      </div>`;

    content.querySelectorAll('tr.row').forEach(tr => tr.onclick = () => openCall(tr.dataset.id));
  }

  // ---------- transcript drawer ----------
  const bg = document.getElementById('drawerBg');
  const drawer = document.getElementById('drawer');
  const body = document.getElementById('drawerBody');
  const close = () => { drawer.classList.remove('open'); bg.classList.remove('open'); };
  bg.onclick = close;
  document.getElementById('drawerX').onclick = close;
  addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  async function openCall(id) {
    body.innerHTML = '<div class="empty">Loading…</div>';
    bg.classList.add('open'); drawer.classList.add('open');
    try {
      const r = await fetch(`${API}/api/dashboard/calls/${encodeURIComponent(id)}`, { headers: auth });
      if (!r.ok) throw new Error(r.status);
      const c = await r.json();
      body.innerHTML = `
        <h3 style="font-size:19px; margin-bottom:6px">Call transcript</h3>
        <p class="mute" style="font-size:12.5px; margin:0 0 8px">
          ${when(c.started_at)} · ${mmss(c.duration_seconds)} · ${c.transcript.length} turns</p>
        <p style="margin:0 0 26px"><span class="pill p-${c.outcome}">${label(c.outcome)}</span></p>
        ${c.transcript.length ? c.transcript.map(t => `
          <div class="turn ${t.speaker === 'caller' ? 'caller' : 'agent'}">
            <div class="who">${t.speaker === 'caller' ? 'Caller' : 'Vaani'}</div>
            <div class="txt">${esc(t.text)}</div>
          </div>`).join('') : '<div class="empty">No transcript recorded.</div>'}`;
    } catch (e) {
      body.innerHTML = '<div class="empty">Could not load this transcript.</div>';
    }
  }

  const range = document.getElementById('range');
  range.onchange = () => load(range.value);
  load(range.value);
})();
</script>
</body>
</html>
